<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Riverdeck — a fair, honest browser poker game against five opponents. One cryptographic shuffle per hand, real hand rankings, equity-based AI, no rigging." />
  <meta name="theme-color" content="#0b3d2e" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Riverdeck" />
  <title>Riverdeck — Fair Poker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='52' font-size='78' text-anchor='middle' dominant-baseline='central'%3E%E2%99%A0%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">&spades;</span>
        <div class="brand-text">
          <h1>Riverdeck</h1>
          <p class="tagline">Fair-dealt poker &middot; 6 players &middot; one honest shuffle per hand</p>
        </div>
      </div>
    </header>

    <main>
      <!-- 5 AI opponents -->
      <section id="opponents" class="opponents" aria-label="Opponents"></section>

      <!-- Community cards + pot -->
      <section class="felt">
        <div class="felt-top">
          <span id="stage-label" class="stage">Pre-Flop</span>
          <span id="pot" class="pot">Pot: 0</span>
        </div>
        <div id="community" class="community"></div>
        <div id="message" class="message" role="status"></div>
      </section>

      <!-- The human player -->
      <section id="human" class="seat human">
        <div id="human-cards" class="cards big"></div>
        <div id="human-hand" class="hand-name"></div>
        <div id="human-info" class="human-info"></div>
      </section>

      <!-- Action log -->
      <section class="log-wrap">
        <h2>Table log</h2>
        <div id="log" class="log" aria-live="polite"></div>
      </section>

      <details class="ai-debug">
        <summary>Developer: AI decisions</summary>
        <div id="ai-decision-log" class="ai-decision-log"></div>
      </details>
    </main>

    <!-- Sticky action bar: always within thumb reach on phones -->
    <div class="actionbar">
      <div id="turn-status" class="turn-status" aria-live="polite"></div>

      <!-- Action controls (shown only on your turn) -->
      <section id="controls" class="controls" style="display:none;">
        <div id="raise-area" class="raise-area">
          <input type="range" id="raise-slider" aria-label="Raise amount" />
          <input type="number" id="raise-input" aria-label="Raise amount" inputmode="numeric" />
          <button id="btn-raise" class="btn raise">Raise to</button>
        </div>
        <button id="btn-fold" class="btn fold">Fold</button>
        <button id="btn-check-call" class="btn call" data-mode="check">Check</button>
        <button id="btn-allin" class="btn allin">All-In</button>
      </section>

      <div class="table-buttons">
        <button id="btn-next-hand" class="btn next" style="display:none;">Deal Next Hand</button>
        <button id="btn-new-game" class="btn newgame" style="display:none;">New Game</button>
      </div>
    </div>
  </div>

  <!-- Start screen: play offline vs AI, or join an online table by game code. -->
  <div id="lobby" class="lobby-overlay">
    <div class="lobby-card">
      <div class="lobby-brand"><span class="brand-mark">&spades;</span><h2>Riverdeck</h2></div>

      <div id="lobby-choose" class="lobby-panel">
        <p class="lobby-lead">A fair deal, every hand.</p>
        <button id="lobby-solo" class="btn call lobby-btn">Play vs AI &middot; offline</button>
        <button id="lobby-online-btn" class="btn raise lobby-btn">Play with friends &middot; online</button>
      </div>

      <div id="lobby-online" class="lobby-panel" hidden>
        <label class="lobby-field">Your name
          <input id="lobby-name" type="text" maxlength="16" placeholder="Player" autocomplete="off" />
        </label>
        <label class="lobby-field">Game code
          <span class="lobby-code-row">
            <input id="lobby-code" type="text" maxlength="12" placeholder="e.g. RIVER" autocomplete="off" autocapitalize="characters" />
            <button id="lobby-random" type="button" class="lobby-mini">Random</button>
          </span>
        </label>
        <label class="lobby-check"><input id="lobby-fill" type="checkbox" checked /> Fill empty seats with AI</label>
        <button id="lobby-join" class="btn call lobby-btn">Join / Create table</button>
        <button id="lobby-back" type="button" class="lobby-link">Back</button>
        <div id="lobby-error" class="lobby-error" role="alert"></div>
        <p class="lobby-note">Share the code with a friend &mdash; whoever types the same code joins your table.</p>
      </div>

      <div id="lobby-room" class="lobby-panel" hidden>
        <p class="lobby-lead">Table ready</p>
        <p class="lobby-sub">Share this game code:</p>
        <div id="room-code" class="room-code">&mdash;</div>
        <p id="room-share" class="lobby-note"></p>
        <ul id="room-players" class="room-players"></ul>
        <label class="lobby-check"><input id="room-fill" type="checkbox" checked /> Fill empty seats with AI</label>
        <button id="room-start" class="btn call lobby-btn">Start game</button>
        <p id="room-hint" class="lobby-note"></p>
        <button id="room-leave" type="button" class="lobby-link">Leave table</button>
      </div>
    </div>
  </div>

  <!-- Load in dependency order; plain scripts so it runs from a file:// path. -->
  <script src="deck.js"></script>
  <script src="evaluator.js"></script>
  <script src="ai.js"></script>
  <script src="cards-ui.js"></script>
  <script src="game.js"></script>
  <script src="online.js"></script>
</body>
</html>
